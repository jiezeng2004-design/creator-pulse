name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv/python
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python }}-

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install deps
        working-directory: backend
        run: |
          uv venv .venv
          .venv\Scripts\activate
          uv pip install -e ".[dev]"

      - name: Run pyright type check
        working-directory: backend
        run: |
          .venv\Scripts\python -m pyright app tests

      - name: Run pytest
        working-directory: backend
        run: |
          .venv\Scripts\python -m pytest tests/ -q

      - name: Run ruff
        working-directory: backend
        run: |
          .venv\Scripts\python -m ruff check app tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run lint
        working-directory: frontend
        run: pnpm lint

      - name: Run tests
        working-directory: frontend
        run: pnpm test

      - name: Run build
        working-directory: frontend
        run: pnpm build
