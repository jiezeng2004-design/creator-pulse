[project]
name = "creator-pulse"
version = "0.1.0"
description = "Local-first multi-platform creator data aggregation tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "tweepy[async]>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Keep test artifacts inside the project instead of the OS temp dir. This
# avoids collisions/denials when the user-level pytest temp directory is owned
# by another identity (e.g. after an elevated run), and keeps cleanup local.
addopts = "--basetemp=.pytest_temp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "UP046", # keep Generic[T] for broader pydantic compatibility
]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
# Point pyright at the project virtual environment; without this it cannot
# resolve sqlalchemy / apscheduler / fastapi imports when run from the CLI.
venvPath = "."
venv = ".venv"
