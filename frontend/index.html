<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CreatorPulse — a local-first command center for creator accounts, content metrics, and comment triage."
    />
    <meta name="theme-color" content="#f4f3ee" />
    <title>CreatorPulse | Local-first creator cockpit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171a18'/%3E%3Ctext x='32' y='42' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='24' font-weight='700' fill='%23faf9f5' text-anchor='middle'%3ECP%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var saved = localStorage.getItem("cp-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage unavailable */
        }
      })();
    </script>
  </head>
  <body class="bg-cream-100 text-ink-900 dark:bg-[#121512] dark:text-[#e6e8e3]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
